T(`<h3>Corpo</h3><p>Nella scheda Corpo trovi peso, misure e massa grassa. Pesati 2–3 volte a settimana e prendi le misure col metro ogni 2 settimane: con vita e collo (e fianchi per le donne) l’app stima la percentuale di grasso, oppure puoi scrivere quella della tua bilancia smart.</p>`)+

<h3>${T('Altri servizi')}</h3><ul>${T('<li><b>Open Food Facts</b>: quando cerchi un prodotto online o scansioni un codice a barre, viene inviato solo il testo cercato o il codice, non i tuoi dati.</li><li><b>Netlify</b>, che ospita l’app: come ogni server può registrare dati tecnici di accesso (ad esempio indirizzo IP e tipo di browser) per sicurezza e funzionamento.</li>')}${A?T('<li><b>Google</b>, se scegli di accedere con Google: riceve la richiesta di accesso, non i tuoi dati di DietApp.</li>')+T('<li><b>Notifiche sul telefono</b> (se le attivi): Google Firebase Cloud Messaging riceve un codice che identifica il telefono, per consegnarle. Sul nostro server salviamo questo codice con fuso orario, lingua, orari scelti, giorni di pesata e giorni di fila, per sapere quando mandarti un promemoria. Si cancellano quando disattivi le notifiche o elimini l’account.</li>')+T('<li><b>Piano e codici regalo</b>: sul nostro server salviamo la data di inizio della prova, la scadenza del Pro e i codici regalo che hai usato. Si cancellano quando elimini l’account.</li>')+T('<li><b>Assistente AI</b> (se lo usi): quello che scrivi, le foto che invii e, per il coach e il commento della settimana, un riepilogo dei tuoi dati (obiettivi, pasti, peso, passi, allenamenti) passano dalle funzioni di Netlify e dal suo AI Gateway a <b>Google Gemini</b>, solo per generare la risposta. Netlify non conserva questi contenuti e Google, con il servizio a pagamento, non li usa per addestrare i suoi modelli; può conservarli per un periodo limitato solo per prevenire abusi. Contiamo le richieste di ogni giorno per applicare il limite giornaliero. Ti chiediamo il consenso la prima volta.</li>'):''}</ul>

const clp=(v,a,b)=>Math.min(b,Math.max(a,v)),swimM=w=>w.lap>0?w.lap*(w.lv||25):0;
function woMET(w,c){const s=spOf(w),k=s[4],f=w.rpe?.55+.09*w.rpe:1,v=w.km>0&&w.min>0?w.km/(w.min/60):0;
if(k=='gym')return c.metB+c.metI*(w.rpe||6);

if(k=='hike')return 6*f+(w.dp>0&&w.min>0?Math.min(4,.005*w.dp/(w.min/60)):0);
if(k=='bike'){const t=w.st||'str';return t=='str'&&v?clp(.5*v-1.5,3.5,16):(SUBM.bike[t]||7.5)*f}

if(k=='cardio')return(SUBM.cardio[w.st]||c.metC)*f;
if(SUBM[k]&&SUBM[k][w.st])return SUBM[k][w.st]*f;
return s[3]*f}
const woMin=(w,c)=>w.min>0?w.min:(spOf(w)[4]=='gym'?c.gymMin:0);

function woSteps(w){const k=spOf(w)[4];if(!['run','walk','hike'].includes(k)||w.sc===false)return 0;return w.km>0?w.km*(k=='run'?900:1350):(w.min||0)*(k=='run'?160:105)}

function woInfo(w,noSt){const k=spOf(w)[4],a=[];if(w.st&&!noSt){const o=(SUB[k]||[]).find(z=>z[0]==w.st);if(o)a.push(o[1].toLowerCase())}
if(w.km>0){a.push(fv(w.km)+' km');if(w.min>0)a.push(k=='bike'?f1(w.km/(w.min/60))+' km/h':pace(w.min,w.km)+' min/km')}

if(w.ex&&w.ex.length){const ns=w.ex.reduce((s,e)=>s+e.sets.length,0),vol=w.ex.reduce((s,e)=>s+e.sets.reduce((t,z)=>t+(z.r||0)*(z.kg||0),0),0);a.push(w.ex.length==1?T('1 esercizio'):T('{n} esercizi',{n:w.ex.length}));if(ns)a.push(T('{n} serie',{n:ns}));if(vol)a.push(T('{n} kg sollevati',{n:f0(vol)}))}
return a}

function allWo(sd,si){const r=[];for(const d of Object.keys(S.days).sort())(S.days[d].wo||[]).forEach((w,i)=>{if(!(d===sd&&i===si))r.push({d,w})});return r}
function lastEx(n){for(const {w} of allWo(cur(),WI).reverse()){const e=(w.ex||[]).find(e=>e.n===n);if(e)return e}return null}
function bestEx(n,sd,si){let b=0;for(const {w} of allWo(sd,si))for(const e of w.ex||[])if(e.n===n)for(const z of e.sets)if(z.r>0&&z.kg>b)b=z.kg;return b}
function recentEx(){const out=[];for(const {w} of allWo().reverse())for(const e of w.ex||[])if(!out.includes(e.n)){out.push(e.n);if(out.length>=8)return out}return out}
const lastGym=()=>allWo(cur(),WI).reverse().find(({w})=>w.s=='pesi'&&w.ex&&w.ex.length)||null;
const recF=v=>!v?'–':v<60?v+' s':v%60?Math.floor(v/60)+'′'+(v%60)+'″':v/60+' min';
function exHTML(){const L=WO.ex||[],lg=lastGym(),TPL=S.wtpl;let h=`<p class="sub">${T('Esercizi')} <small class="mu" style="font-weight:600">${T('facoltativi')}</small></p>`;
if(!L.length&&(lg||TPL.length))h+=`<div class="chips" style="margin-bottom:10px">${lg?`<button class="chip" onclick="woRepeat()">↺ ${T('Come il {d}',{d:dm(lg.d)})}</button>`:''}${TPL.map((t,i)=>`<button class="chip" onclick="woTpl(${i})">📋 ${E(t.n)}</button>`).join('')}</div>`;
h+=L.map((e,i)=>{const b=bestEx(e.n,cur(),WI);return`<div class="exc"><div class="exh"><b>${E(e.n)}</b><button class="xb" onclick="exDel(${i})" aria-label="${T('Togli {n}',{n:E(e.n)})}">✕</button></div>${b?`<span class="mu">${T('Record: {n} kg',{n:fv(b)})}</span>`:''}${e.sets.length?`<div class="set seth"><span>#</span><span>${T('Ripetizioni')}</span><span></span><span>Kg</span><span></span></div>`:''}${e.sets.map((z,j)=>`<div class="set"><span>${j+1}</span><input inputmode="numeric" aria-label="${T('Ripetizioni serie {n}',{n:j+1})}" data-e="${i}" data-s="${j}" data-f="r" value="${wv(z.r)}"><span>×</span><input inputmode="decimal" aria-label="${T('Kg serie {n}',{n:j+1})}" data-e="${i}" data-s="${j}" data-f="kg" value="${wv(z.kg)}"><button class="xb" onclick="setDel(${i},${j})" aria-label="${T('Togli serie {n}',{n:j+1})}">✕</button></div>`).join('')}<div class="exf"><button class="chip" onclick="setAdd(${i})">+ ${T('Serie')}</button><label>${T('Recupero')} <select data-e="${i}" data-f="rec">${[0,30,45,60,90,120,150,180,240,300].map(v=>`<option value="${v}"${(e.rec||0)==v?' selected':''}>${recF(v)}</option>`).join('')}</select></label></div></div>`}).join('');
h+=`<button class="s w" style="margin-top:0" onclick="exPick()">+ ${T('Aggiungi esercizio')}</button>`;
if(L.length)h+=`<details style="margin-top:10px"><summary>📋 ${T('Salva come scheda')}</summary><p class="mu" style="margin-top:0">${T('La ritrovi la prossima volta che registri la sala pesi.')}</p><div class="qrow"><input id="tpn" maxlength="30" placeholder="${T('Es. Push, Gambe, Scheda A')}"><button style="margin:0;flex:none" onclick="tplSave()">${T('Salva')}</button></div></details>`;
return h}
function exPick(){sheet(`<h3>${T('Aggiungi esercizio')}</h3><input id="exq" type="search" placeholder="${T('Cerca: panca, squat, curl…')}" autocomplete="off" oninput="exList()"><div id="exl"></div><button class="lnk" onclick="woEdit()">‹ ${T('Torna all’allenamento')}</button>`);document.querySelector('#sheet .sh-in').scrollTop=0;exList()}
function exList(){const raw=$('exq').value.trim(),q=norm(raw),rec=recentEx();EXL=[];const row=n=>{EXL.push(n);return`<div class="fr" onclick="exAdd(${EXL.length-1})"><b>${E(n)}</b><span class="chev">+</span></div>`};let h='';
if(!q){if(rec.length)h+=`<label>${T('Recenti')}</label>`+rec.map(row).join('');for(const g in EX)h+=`<label>${g}</label>`+EX[g].map(row).join('')}

function tplHTML(){return S.wtpl.length?S.wtpl.map((t,i)=>`<div class="ml"><div><b>${E(t.n)}</b><div class="mu">${E(t.ex.map(e=>e.n).join(', '))}</div></div><button class="xb" onclick="tplDel(${i})" aria-label="${T('Elimina scheda')}">✕</button></div>`).join('')+`<p class="mu">${T('Le schede compaiono quando registri un allenamento in sala pesi.')}</p>`:`<div class="empty"><div class="bigi">🏋️</div><h3>${T('Nessuna scheda')}</h3><p class="mu">${T('Quando registri un allenamento in sala pesi, usa “Salva come scheda” per ritrovare gli stessi esercizi la volta dopo.')}</p></div>`}

function tplDel(i){const t=S.wtpl.splice(i,1)[0];persist();pgTpl();refreshSettings();note(T('Scheda eliminata'),0,{label:T('Annulla#undo'),fn:()=>{S.wtpl.splice(i,0,t);persist();pgTpl();refreshSettings()}})}

function swipeClose(el,o){let y0=0,x0=0,t0=0,dy=0,on=false,ok=false;
el.addEventListener('touchstart',e=>{if(e.touches.length!==1){ok=false;return}y0=e.touches[0].clientY;x0=e.touches[0].clientX;t0=Date.now();dy=0;on=false;ok=o.can()&&!e.target.closest('.tpc')},{passive:true});
el.addEventListener('touchmove',e=>{if(!ok)return;const dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;
if(!on){if(dy<-8||Math.abs(dx)>12&&Math.abs(dx)>dy){ok=false;return}if(dy<10)return;if(!o.top()){ok=false;return}on=true;t0=Date.now();y0+=10;dy-=10;o.begin()}
if(e.cancelable)e.preventDefault();o.move(Math.max(0,dy))},{passive:false});
el.addEventListener('touchend',()=>{if(!on){ok=false;return}on=false;ok=false;const v=dy/Math.max(1,Date.now()-t0);if(dy>Math.min(140,el.offsetHeight*.25)||(v>.5&&dy>30))o.close();else o.back()});
el.addEventListener('touchcancel',()=>{if(on)o.back();on=false;ok=false})}

Here's what I ate:`,
fr:`Je te dis ce que j'ai mangé. Estime les calories et les macronutriments avec des valeurs réalistes, en tenant compte des quantités, de la cuisson et des assaisonnements.

Voici ce que j'ai mangé :`,
es:`Te cuento lo que he comido. Estima las calorías y los macronutrientes con valores realistas, teniendo en cuenta cantidades, cocción y aliños.
Al final, respóndeme con UNA línea por cada día, exactamente en este formato, con los totales del día:
DD/MM/AAAA | kcal 0 | prot 0 | carbohidratos 0 | grasas 0
Solo si te los indico, añade también al final de la línea: | pasos 0 | peso 0 | cintura 0 | agua 0 | sueño 0 | gimnasio sí | duración 0 | intensidad 0

Si te digo que el día ha terminado, añade: | cerrado
Escribe los números sin puntos de miles (ej. 1850, no 1.850).
Esto es lo que he comido:`,
de:`Ich schreibe dir, was ich gegessen habe. Schätze Kalorien und Makronährstoffe realistisch ein und berücksichtige Mengen, Zubereitung und Dressings.

TT/MM/JJJJ | kcal 0 | Eiweiß 0 | Kohlenhydrate 0 | Fett 0
Nur wenn ich sie dir nenne, füge am Ende der Zeile auch hinzu: | Schritte 0 | Gewicht 0 | Taille 0 | Wasser 0 | Schlaf 0 | Fitnessstudio ja | Dauer 0 | Intensität 0

Wenn ich dir sage, dass der Tag vorbei ist, füge hinzu: | abgeschlossen

Das habe ich gegessen:`},AIP=AIPS[LG]||AIPS.it;

function authMsg(t,bad){const e=$('aum');if(e){e.textContent=t;e.classList.toggle('bad',!!bad)}else if(t)note(t,bad)}
async function authProv(p){if(!(await fbInit()))return authShow('offline');authMsg(T('Ti porto alla pagina di accesso…'));try{const pr=p=='google'?new FX.U.GoogleAuthProvider():new FX.U.FacebookAuthProvider();if(p=='google')pr.setCustomParameters({prompt:'select_account'});await FX.U.signInWithRedirect(FA,pr)}catch(e){authMsg(aerr(e),1)}}
async function authEmail(ev){ev.preventDefault();const em=$('aue').value.trim(),pw=$('aupw').value;if(!em||!pw)return authMsg(T('Scrivi email e password.'),1);if(!(await fbInit()))return authShow('offline');
authMsg(AUM=='up'?T('Creo l’account…'):T('Accedo…'));try{if(AUM=='up'){const r=await FX.U.createUserWithEmailAndPassword(FA,em,pw);FX.U.sendEmailVerification(r.user).catch(()=>{})}else await FX.U.signInWithEmailAndPassword(FA,em,pw)}catch(e){authMsg(aerr(e),1)}}
async function authReset(){const em=($('aue')||{}).value||'';if(!em.trim())return authMsg(T('Scrivi la tua email qui sopra, poi tocca di nuovo “Password dimenticata?”.'),1);if(!(await fbInit()))return authShow('offline');
try{await FX.U.sendPasswordResetEmail(FA,em.trim());authMsg(T('Ti abbiamo mandato un’email per scegliere una nuova password.'))}catch(e){authMsg(aerr(e),1)}}
function authConsent(){if(!['ck1','ck2','ck3'].every(i=>$(i).checked))return authMsg(T('Per usare DietApp servono tutte e tre le conferme.'),1);S.consent={at:new Date().toISOString(),v:1};persist(0);syncPush().catch(e=>{SYERR=e.code||'errore'});authDone()}

function syncSoon(){if(!FBCFG||!window.__syncOn||!sMeta().uid)return;clearTimeout(SYT);SYT=setTimeout(()=>syncPush().catch(()=>{}),2500)}
async function syncPull(first){const m=sMeta();if(!m.uid||!FU||!(await fbInit()))return false;const F=FX.F,uid=m.uid;let ch=false;
const ms=await F.getDoc(F.doc(FD,'users',uid));if(ms.exists()){const r=ms.data(),ru=r._u||0;if(ru>(m.mainU||0)){const dirty=m.h.main!==hsh(sPick());if(!dirty||!m.mainU){MAINK.forEach(k=>{if(r[k]!==undefined)S[k]=r[k]});S=migrate(S);ch=true}m.mainU=ru}}
const qs=await F.getDocs(F.query(F.collection(FD,'users',uid,'days'),F.where('_u','>',m.pull||0)));
qs.forEach(d=>{const r=d.data(),id=d.id,u=r._u||0;delete r._u;const loc=S.days[id],dirty=loc?m.h.days[id]!==hsh(loc):m.h.days[id]!=null;
if(!dirty){if(r._del){if(loc){delete S.days[id];ch=true}delete m.h.days[id]}else{S.days[id]=r;m.h.days[id]=hsh(r);ch=true}}if(u>(m.pull||0))m.pull=u});
m.last=Date.now();sSave(m);if(ch){S=migrate(S);persist(0);if(APPSTARTED){render();refresh()}}SYERR='';return ch}
async function syncPush(){const m=sMeta();if(!m.uid||!FU||!S.consent||SYBUSY||navigator.onLine===false||!(await fbInit()))return;SYBUSY=true;const F=FX.F,uid=m.uid,now=Date.now();
try{const W=[];for(const d in S.days){const h=hsh(S.days[d]);if(m.h.days[d]!==h)W.push([d,S.days[d],h])}for(const d in m.h.days)if(!S.days[d])W.push([d,null,null]);
for(let i=0;i<W.length;i+=400){const b=F.writeBatch(FD);W.slice(i,i+400).forEach(([d,x])=>b.set(F.doc(FD,'users',uid,'days',d),x?{...JSON.parse(JSON.stringify(x)),_u:now}:{_del:true,_u:now}));await b.commit();W.slice(i,i+400).forEach(([d,x,h])=>{if(h)m.h.days[d]=h;else delete m.h.days[d]});if(now>(m.pull||0))m.pull=now}
const mh=hsh(sPick());if(m.h.main!==mh){await F.setDoc(F.doc(FD,'users',uid),{...sPick(),_u:now});m.h.main=mh;m.mainU=now}
m.last=Date.now();sSave(m);SYERR=''}catch(e){SYERR=e.code||'errore';throw e}finally{SYBUSY=false;const p=$('pg_acc');if(p)pgAccount()}}
const pending=()=>{const m=sMeta();if(!m.uid)return 0;let n=0;for(const d in S.days)if(m.h.days[d]!==hsh(S.days[d]))n++;for(const d in m.h.days)if(!S.days[d])n++;if(m.h.main!==hsh(sPick()))n++;return n};
addEventListener('online',()=>{if(FBCFG&&FU)syncPull().then(()=>syncPush()).catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&FBCFG&&FU)syncPull().then(()=>syncPush()).catch(()=>{})});

const st=!u?'⏳ '+T('In attesa di collegamento'):navigator.onLine===false?'📴 '+T('Offline: i dati si salveranno online appena torni connesso'):SYERR?'⚠️ '+T('Ultimo tentativo non riuscito'):p?'⏳ '+(p==1?T('1 modifica da salvare'):T('{n} modifiche da salvare',{n:p})):'✅ '+T('Tutto salvato online')+(m.last?' · '+new Date(m.last).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'}):'');
openPage('acc',T('Account'),`<div class="phd"><div class="${avCls()}">${S.cfg.name||S.cfg.av?avIn():E((em||'?').slice(0,1).toUpperCase())}</div><div class="phn"><h1 style="font-size:22px">${E(S.cfg.name||T('Il tuo account'))}</h1><p class="mu">${E(em)}${pn?' · '+pn:''}</p></div></div>
${avEdit()}<div class="c"><b style="font-size:17px">${T('Sincronizzazione')}</b><span style="display:block;margin-top:4px;font-size:14px">${st}</span><button class="s w" onclick="syncNow()">☁️ ${T('Sincronizza ora')}</button></div>
${u&&pv=='password'&&!u.emailVerified?`<div class="c warn"><b>📧 ${T('Verifica la tua email')}</b><span>${T('Ti abbiamo mandato un link a {e}: aprilo per confermare l’indirizzo.',{e:E(em)})}</span><div class="row"><button onclick="FX.U.sendEmailVerification(FU).then(()=>note(T('📧 Email inviata'))).catch(e=>note(aerr(e),1))">${T('Invia di nuovo')}</button></div></div>`:''}
<p class="mu">${T('I tuoi dati sono salvati sul telefono e nel tuo account, su server in Europa. Funziona anche offline: le modifiche si salvano online appena c’è internet.')}</p>
<button class="s w" onclick="authOut()">${T('Esci dall’account')}</button><button class="w danger" onclick="accDelete()">${T('Elimina account e dati')}</button>`)}
async function syncNow(){if(navigator.onLine===false)return note(T('Sei offline: riprova quando c’è internet'),1);note('☁️ '+T('Sincronizzo…'));try{await syncPull();await syncPush();note('✅ '+T('Tutto salvato online'))}catch(e){note(T('Sincronizzazione non riuscita: riprova'),1)}if($('pg_acc'))pgAccount()}
async function authDecline(){try{if(FA)await FX.U.signOut(FA)}catch(e){}try{localStorage.removeItem(SYK)}catch(e){}location.replace(location.pathname)}
function authClose(){const b=$('auth');b.hidden=true;b.dataset.v=''}

try{if(pushSt().tok)await pushOff(1)}catch(e){}try{if(FA)await FX.U.signOut(FA)}catch(e){}try{localStorage.removeItem(K);localStorage.removeItem(SYK)}catch(e){}location.replace(location.pathname)};
if(skip)return go();alertBox({icon:'👋',bg:'#e3ecff',title:T('Uscire dall’account?'),text:T('I tuoi dati restano salvati nel tuo account. Da questo telefono verranno tolti finché non accedi di nuovo.'),buttons:[{label:T('Esci'),danger:true,fn:go},{label:T('Annulla')}]})}
function accDelete(){alertBox({icon:'🗑️',bg:'#ffd9d2',title:T('Eliminare l’account?'),text:T('Verranno cancellati per sempre l’account e tutti i dati: pasti, allenamenti, pesate, misure e traguardi, online e su questo telefono. Non si può annullare.'),buttons:[{label:T('Elimina tutto'),danger:true,fn:()=>alertBox({icon:'⚠️',bg:'#ffd9d2',title:T('Sei sicuro?'),text:T('Ultima conferma: l’account non si potrà recuperare.'),buttons:[{label:T('Sì, elimina account'),danger:true,fn:accDelGo},{label:T('Annulla')}]})},{label:T('Prima esporta un backup'),fn:exp},{label:T('Annulla')}]})}
async function accDelGo(){if(navigator.onLine===false||!FU)return note(T('Serve internet per eliminare l’account'),1);const u=FU,pv=u.providerData[0]?u.providerData[0].providerId:'',age=Date.now()-new Date(u.metadata.lastSignInTime).getTime();
if(age>4*60e3){if(pv=='password')return sheet(`<h3>${T('Conferma la password')}</h3><p class="mu">${T('Per sicurezza, scrivi la password del tuo account.')}</p><input id="rpw" type="password" autocomplete="current-password" placeholder="${T('Password')}"><button class="w danger" onclick="accReauth()">${T('Elimina definitivamente')}</button><button class="lnk" onclick="closeSheet()">${T('Annulla')}</button>`);
try{sessionStorage.setItem('delPending','1');await FX.U.reauthenticateWithRedirect(u,pv=='facebook.com'?new FX.U.FacebookAuthProvider():new FX.U.GoogleAuthProvider())}catch(e){sessionStorage.removeItem('delPending');note(aerr(e),1)}return}
await accWipe()}

async function accWipe(){note('🗑️ '+T('Elimino l’account…'));const F=FX.F,uid=FU.uid;try{await api('/api/push',{op:'forget'})}catch(e){}pushSave(null);try{localStorage.removeItem(PLANK)}catch(e){}try{const qs=await F.getDocs(F.collection(FD,'users',uid,'days'));let b=F.writeBatch(FD),n=0;for(const d of qs.docs){b.delete(d.ref);if(++n%400==0){await b.commit();b=F.writeBatch(FD)}}await b.commit();await F.deleteDoc(F.doc(FD,'users',uid));await FX.U.deleteUser(FU)}
