[build]
  publish = "public"
  command = ""

# Funzioni sul server (es. richiesta di eliminazione dati da Facebook): /api/...
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
